{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" -}}
{{- with resources.Get $src -}}
  <figure class="docs-screenshot">
    <a href="{{ .RelPermalink }}" target="_blank" rel="noopener noreferrer" aria-label="Open full-size screenshot: {{ $alt }}">
      <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="{{ $alt }}" loading="lazy" decoding="async">
    </a>
    <figcaption>Click the screenshot to open it at full size.</figcaption>
  </figure>
{{- else -}}
  {{- errorf "Screenshot %q not found in assets (page %q)" $src .Page.File.Path -}}
{{- end -}}
